<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>local-agents</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown-dark.css" integrity="sha384-nlth4oyFjBlAziFH2oypWWsE00W7j/6uVR4/Fz1++oPhaqeF8LujWsaX3ChXZw/1" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="title">local-agents</span>
  <span class="meta" id="meta">connecting...</span>
</header>
<div id="log"></div>
<form id="composer">
  <textarea id="input" autocomplete="off" placeholder="Message..." autofocus rows="1"></textarea>
  <button type="button" id="stop" hidden>Stop</button>
  <button type="submit" id="send">Send</button>
</form>
<script src="https://cdn.jsdelivr.net/npm/marked@18.2.1/lib/marked.umd.js" integrity="sha384-eGsnYqMR1DwKM8Hap0jzlzZulA9iLneQ1yxDuryiYhQd2xn7qVXF+6yXoP7plj95" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.18/dist/purify.min.js" integrity="sha384-lkArbWjiZKuE+bzKbj1vOEF7DKYBDNvgwZMCt5OH8bdRB92zpzyNska9Q/XKPHQD" crossorigin="anonymous"></script>
<script src="/app.js"></script>
</body>
</html>
